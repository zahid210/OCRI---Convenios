name: ocri

services:
  # ─── MariaDB ───────────────────────────────────────────────────────────────
  # Sobre el primer arranque (volumen vacío) ejecuta ./dumps/*.sql, que crea la
  # base y carga datos iniciales (catálogos + 447 convenios históricos).
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ocri}
      MARIADB_USER: ${DB_USER:-ocri}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/mysql
      - ./dumps:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── Backend (solo red interna) ────────────────────────────────────────────
  backend:
    build: ./ocri-backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      # El puerto no se expone al host: lo consume el frontend por la red interna.
      DATABASE_URL: mariadb://${DB_USER:-ocri}:${DB_PASSWORD}@db:3306/${DB_NAME:-ocri}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (mínimo 32 caracteres)}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      # S3/OBS de Huawei es el único almacén de documentos: no hay espejo en
      # disco. Las credenciales son obligatorias y compose se niega a levantar el
      # backend si faltan, en lugar de dejar que la aplicación degrade en
      # silencio. Definir S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY y
      # S3_ENDPOINT en el .env de la raíz.
      S3_BUCKET: ${S3_BUCKET:?Defina S3_BUCKET en .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Defina S3_ACCESS_KEY_ID en .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Defina S3_SECRET_ACCESS_KEY en .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?Defina S3_ENDPOINT en .env}
      S3_REGION: ${S3_REGION:-LA-SANTIAGO}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-300}
      S3_PREFIX: ${S3_PREFIX:-OCRI_convenios}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-ocri@uncp.edu.pe}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Sin volumen de uploads: los documentos viven en el bucket. Los recursos
    # estáticos de las plantillas de oficio sí se montan de solo lectura.
    volumes:
      - ./ocri-backend/uploads/templates:/app/uploads/templates:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 15

  # ─── Frontend (único puerto público) ───────────────────────────────────────
  # Next standalone sirve la UI y proxea todo el API bajo /api (rewrite única
  # /api/:path* → backend /api/:path*); ver ocri-frontend/next.config.ts.
  frontend:
    build:
      context: ./ocri-frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        API_PROXY_URL: http://backend:4000
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 15

volumes:
  db-data: